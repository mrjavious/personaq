[package]
name = "personaq"
version = "0.1.0"
description = "Persona Studio - Autonomous management engine for disclosed AI personas"
authors = ["Persona Studio Contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "dialog-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
